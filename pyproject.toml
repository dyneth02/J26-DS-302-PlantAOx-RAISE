[project]
name = "plantaox-raise"
version = "0.1.0"
description = "PlantAOx-RAISE research components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "torch",
    "scikit-learn==1.9.0",
    "pulearn==0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "biopython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
