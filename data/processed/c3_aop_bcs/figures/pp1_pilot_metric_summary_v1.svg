<text x="60.00" y="694.00" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B7A">Higher IR and BCS are preferable; lower FSR is preferable. Do not interpret dummy values scientifically.</text>
